# Codecov configuration.
#
# Each test suite uploads under its own flag, so a component's coverage can be
# read without the others diluting it -- see .github/workflows/ci.yml for the
# uploads themselves.
coverage:
  status:
    project:
      default:
        # Backend and frontend only. Airflow is excluded because its DAG source
        # sits at 28% and would drag the headline number down on every upload
        # while it is not the product code anyone ships. Revisit once the DAG
        # suite grows past this.
        flags:
          - backend
          - frontend
        target: auto
        threshold: 1%

flag_management:
  default_rules:
    # Every upload is a complete measurement of its own component, so a failed
    # run must not inherit the last good result for the same flag.
    carryforward: false
  individual_flags:
    - name: backend
      paths:
        - backend/
    - name: frontend
      paths:
        - frontend/
    - name: airflow
      paths:
        - airflow/
