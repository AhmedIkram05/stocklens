# DependabotConfig
#
# Automated dependency updates for npm packages and GitHub Actions.
version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10
    labels:
      - 'dependencies'
    commit-message:
      prefix: 'chore'
      prefix-development: 'chore'
    # Native module versions are tied to the Expo SDK: each `expo-*` package is
    # released in lockstep with the SDK, so its version is decided by
    # `expo/bundledNativeModules.json` (what `npx expo install` resolves
    # against) rather than by "latest on npm". react must additionally match
    # react-native-renderer exactly. Patch and minor bumps stay open; majors are
    # SDK migrations, not dependency updates, and have to go through
    # `npx expo install --fix` so the whole set moves together.
    ignore:
      - dependency-name: 'react'
        update-types: ['version-update:semver-major']
      - dependency-name: 'react-native'
        update-types: ['version-update:semver-major']
      - dependency-name: 'react-native-gesture-handler'
        update-types: ['version-update:semver-major']
      - dependency-name: 'react-native-safe-area-context'
        update-types: ['version-update:semver-major']
      - dependency-name: 'react-native-screens'
        update-types: ['version-update:semver-major']
      - dependency-name: 'react-native-svg'
        update-types: ['version-update:semver-major']
      - dependency-name: '@testing-library/react-native'
        update-types: ['version-update:semver-major']
      # SDK 54 ships these on the 14.x / 3.x lines; 57.x is a later SDK.
      - dependency-name: 'expo-font'
        update-types: ['version-update:semver-major']
      - dependency-name: 'expo-image-manipulator'
        update-types: ['version-update:semver-major']
      - dependency-name: 'expo-status-bar'
        update-types: ['version-update:semver-major']

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
    commit-message:
      prefix: 'chore'
