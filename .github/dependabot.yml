# DependabotConfig
#
# Unified Monday-morning dependency updates: weekly, Monday 09:00
# Europe/London. Minor/patch bumps are grouped into one PR per ecosystem;
# majors stay individual PRs for review.
version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'Europe/London'
    target-branch: 'main'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
      - 'javascript'
    commit-message:
      prefix: 'chore'
      prefix-development: 'chore'
    # Expo SDK-managed packages. Every package that
    # `expo/bundledNativeModules.json` pins is released in lockstep with the
    # SDK, so its version is decided by that file -- what `npx expo install`
    # resolves against -- not by "latest on npm". These packages declare
    # `peerDependencies: {expo: '*'}`, so npm reports no conflict when a bump
    # crosses SDK lines and CI stays green on a tree that cannot work.
    # Within-major bumps drift too (e.g. react-native-screens 4.16.0 -> 4.28.0
    # exceeded the SDK's ~4.16.0 pin and had to be reverted by
    # `npx expo install --fix`), so ALL updates for these are ignored here;
    # the whole set moves together via `npx expo install --fix`.
    #
    # `jest`/`@types/jest` are paired to `jest-expo`'s SDK version (SDK 54
    # pairs jest-expo 54 with jest ~29.7.0), not to "latest".
    #
    # Regenerate the bundled list after any SDK change:
    #   node -e 'const b=require("./node_modules/expo/bundledNativeModules.json");
    #     const d={...require("./package.json").dependencies,
    #              ...require("./package.json").devDependencies};
    #     console.log(Object.keys(b).filter(k=>k in d).sort().join("\n"))'
    # Keep the hand-maintained entries below that list intact -- the command
    # only knows about bundledNativeModules.json, so anything the SDK pins
    # some other way has to be added by hand.
    ignore:
      # SDK-managed: all updates go through `npx expo install --fix`.
      - dependency-name: '@expo/vector-icons'
      - dependency-name: '@types/jest'
      # SDK-managed but NOT in `expo/bundledNativeModules.json`, so the
      # regeneration command above will not emit it -- `expo@54` declares it
      # as a direct dependency instead. Its version tracks the SDK: 54 wants
      # ~54.0.12, 57 wants ~57.0.21. Letting it float installs the preset for
      # a different SDK, which pulls in `babel-plugin-react-compiler` and
      # breaks every React Native jest mock (see #233).
      - dependency-name: 'babel-preset-expo'
      - dependency-name: 'expo'
      - dependency-name: 'expo-blur'
      - dependency-name: 'expo-camera'
      - dependency-name: 'expo-constants'
      - dependency-name: 'expo-file-system'
      - dependency-name: 'expo-font'
      - dependency-name: 'expo-haptics'
      - dependency-name: 'expo-image-manipulator'
      - dependency-name: 'expo-linear-gradient'
      - dependency-name: 'expo-local-authentication'
      - dependency-name: 'expo-secure-store'
      - dependency-name: 'expo-sqlite'
      - dependency-name: 'expo-status-bar'
      - dependency-name: 'jest'
      - dependency-name: 'jest-expo'
      - dependency-name: 'react'
      - dependency-name: 'react-native'
      - dependency-name: 'react-native-gesture-handler'
      - dependency-name: 'react-native-safe-area-context'
      - dependency-name: 'react-native-screens'
      - dependency-name: 'react-native-svg'
      # Not SDK-managed: majors are migrations, patches/minors stay open.
      - dependency-name: '@testing-library/react-native'
        update-types: ['version-update:semver-major']
      - dependency-name: 'eslint'
        update-types: ['version-update:semver-major']
    groups:
      minor-patch:
        update-types: ['minor', 'patch']

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'Europe/London'
    target-branch: 'main'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
      - 'ci'
    commit-message:
      prefix: 'chore'
    groups:
      minor-patch:
        update-types: ['minor', 'patch']

  # Python — backend service (uv project).
  - package-ecosystem: 'uv'
    directory: '/backend'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'Europe/London'
    target-branch: 'main'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
      - 'python'
    commit-message:
      prefix: 'chore'
    groups:
      minor-patch:
        update-types: ['minor', 'patch']

  # Python — ML package (uv project).
  - package-ecosystem: 'uv'
    directory: '/backend/ml'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'Europe/London'
    target-branch: 'main'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
      - 'python'
    commit-message:
      prefix: 'chore'
    # numpy is served from the PyTorch CPU index (tool.uv.index in this
    # project). uv's default first-index-wins strategy cannot see the newer
    # numpy there, so Dependabot's uv resolver errors on it. Skip numpy version
    # bumps here; Dependabot security alerts still fire for numpy.
    ignore:
      - dependency-name: 'numpy'
    groups:
      minor-patch:
        update-types: ['minor', 'patch']

  # Python — feature engineering engine (uv project).
  - package-ecosystem: 'uv'
    directory: '/backend/ml/features-engine'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'Europe/London'
    target-branch: 'main'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
      - 'python'
    commit-message:
      prefix: 'chore'
    groups:
      minor-patch:
        update-types: ['minor', 'patch']

  # Rust — feature engineering engine crate.
  - package-ecosystem: 'cargo'
    directory: '/backend/ml/features-engine'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'Europe/London'
    target-branch: 'main'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
      - 'rust'
    commit-message:
      prefix: 'chore'
    groups:
      minor-patch:
        update-types: ['minor', 'patch']

  # Python — Airflow orchestration stack (pip requirements.txt).
  - package-ecosystem: 'pip'
    directory: '/airflow'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'Europe/London'
    target-branch: 'main'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
      - 'python'
    commit-message:
      prefix: 'chore'
    groups:
      minor-patch:
        update-types: ['minor', 'patch']

  # Docker base images.
  - package-ecosystem: 'docker'
    directory: '/backend'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'Europe/London'
    target-branch: 'main'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
      - 'docker'
    commit-message:
      prefix: 'chore'
    groups:
      docker-all:
        patterns: ['*']

  - package-ecosystem: 'docker'
    directory: '/backend/ml'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'Europe/London'
    target-branch: 'main'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
      - 'docker'
    commit-message:
      prefix: 'chore'
    groups:
      docker-all:
        patterns: ['*']

  - package-ecosystem: 'docker'
    directory: '/airflow'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'Europe/London'
    target-branch: 'main'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
      - 'docker'
    commit-message:
      prefix: 'chore'
    groups:
      docker-all:
        patterns: ['*']

  - package-ecosystem: 'docker'
    directory: '/mlflow'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'Europe/London'
    target-branch: 'main'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
      - 'docker'
    commit-message:
      prefix: 'chore'
    groups:
      docker-all:
        patterns: ['*']

  # Terraform providers.
  - package-ecosystem: 'terraform'
    directory: '/terraform'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'Europe/London'
    target-branch: 'main'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
      - 'terraform'
    commit-message:
      prefix: 'chore'
    groups:
      minor-patch:
        update-types: ['minor', 'patch']
